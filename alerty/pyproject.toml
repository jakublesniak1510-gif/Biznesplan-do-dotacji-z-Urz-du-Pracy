[project]
name = "alerty-naborow-pup"
version = "1.0.0"
description = "Monitor naborów wniosków o dofinansowanie podjęcia działalności gospodarczej w powiatowych urzędach pracy"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
alerty = "monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["monitor"]
